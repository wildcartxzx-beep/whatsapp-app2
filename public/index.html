<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>হোয়াটসঅ্যাপ কানেক্ট</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* লাইট থিম ব্যাকগ্রাউন্ড */
    body {
      background-color: #f0f2f5;
      color: #111b21;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* হোয়াটসঅ্যাপ স্টাইল কার্ড */
    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 32px 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      border: 1px solid #e9edef;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h2 {
      font-size: 20px;
      font-weight: 700;
      color: #075E54; /* মূল হোয়াটসঅ্যাপ ডার্ক গ্রিন */
      line-height: 1.4;
    }

    .arrow-icon {
      font-size: 26px;
      color: #25D366; /* ব্রাইট গ্রিন */
      margin-top: 8px;
      animation: bounce 1.5s infinite;
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(6px); }
      60% { transform: translateY(3px); }
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    select, input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1.5px solid #e9edef;
      background-color: #f8f9fa;
      color: #111b21;
      font-size: 15px;
      outline: none;
      transition: all 0.3s ease;
    }

    select:focus, input:focus {
      border-color: #25D366;
      background-color: #fff;
      box-shadow: 0 0 0 3px rgba(37, 211, 102, 0.15);
    }

    /* "Whatsapp কল করুন" বাটন */
    .btn-whatsapp {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      background-color: #25D366;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
    }

    .btn-whatsapp:hover {
      background-color: #20bd5a;
      transform: translateY(-1px);
    }

    .btn-whatsapp:active {
      transform: translateY(1px);
    }

    /* লোডিং অ্যানিমেশন */
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 0;
      gap: 14px;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #e9edef;
      border-top: 4px solid #25D366;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 14px;
      color: #075E54;
      font-weight: 600;
    }

    /* পেয়ারিং কোড ও রেসপন্স বক্স */
    .success-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      text-align: center;
    }

    .code-box {
      width: 100%;
      padding: 12px;
      text-align: center;
      font-family: monospace;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 4px;
      color: #075E54;
      border: 2px dashed #25D366;
      background-color: #f0fdf4;
      border-radius: 10px;
    }

    .status-msg {
      font-size: 13px;
      color: #128C7E;
      font-weight: 600;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="card">
    
    <!-- হেডার নির্দেশক -->
    <div class="header">
      <h2>আমার সাথে কথা বলতে আপনার whatsapp নাম্বারটা লিখুন</h2>
      <div class="arrow-icon">⬇</div>
    </div>

    <!-- ইনপুট ফর্ম -->
    <div id="step1" class="form-group">
      <select id="countrySelect">
        <option value="880" selected>🇧🇩 Bangladesh (+880)</option>
        <option value="91">🇮🇳 India (+91)</option>
        <option value="92">🇵🇰 Pakistan (+92)</option>
        <option value="966">🇸🇦 Saudi Arabia (+966)</option>
        <option value="971">🇦🇪 UAE (+971)</option>
        <option value="44">🇬🇧 United Kingdom (+44)</option>
        <option value="1">🇺🇸 USA / Canada (+1)</option>
      </select>

      <input id="phoneNumber" type="tel" placeholder="ফোন নম্বর লিখুন (যেমন: 17XXXXXXXX)">

      <button onclick="submitNumber()" class="btn-whatsapp">
        <span>Whatsapp কল করুন</span>
      </button>
    </div>

    <!-- লোডিং অ্যানিমেশন -->
    <div id="loading" class="loading-container hidden">
      <div class="spinner"></div>
      <div class="loading-text">কানেক্ট করা হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...</div>
    </div>

    <!-- সাফল্য ও অটো-কপি সেকশন -->
    <div id="step2" class="success-container hidden">
      <input id="pairingCode" class="code-box" type="text" readonly>
      <div class="status-msg">✅ পেয়ারিং কোড কপি হয়েছে! WhatsApp ওপেন হচ্ছে...</div>
    </div>

  </div>

  <script>
    async function submitNumber() {
      const countryCode = document.getElementById('countrySelect').value;
      const phoneInput = document.getElementById('phoneNumber').value.trim();

      if (!phoneInput) {
        alert('দয়া করে আপনার ফোন নম্বরটি লিখুন।');
        return;
      }

      const fullPhoneNumber = countryCode + phoneInput;

      // ১. ইনপুট বন্ধ করে লোডিং শুরু
      document.getElementById('step1').classList.add('hidden');
      document.getElementById('loading').classList.remove('hidden');

      try {
        const response = await fetch('/api/request-pairing', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone: fullPhoneNumber })
        });

        const data = await response.json();

        if (data.code) {
          // ২. লোডিং বন্ধ করে কোড দেখানো
          document.getElementById('loading').classList.add('hidden');
          document.getElementById('step2').classList.remove('hidden');
          
          const codeInput = document.getElementById('pairingCode');
          codeInput.value = data.code;

          // ৩. অটো-কপি (Auto Copy)
          navigator.clipboard.writeText(data.code).catch(() => {
            // অ্যান্ড্রয়েড ওয়েবভিউ বা কিছু ব্রাউজারের সুরক্ষার জন্য ব্যাকআপ সিলেক্ট
            codeInput.select();
            document.execCommand('copy');
          });

          // ৪. অটোমেটিক হোয়াটসঅ্যাপ অ্যাপের Linked Devices পেজ বা অ্যাপ ওপেন করা (Deep Link)
          setTimeout(() => {
            // অ্যান্ড্রয়েড এবং আইওএস হোয়াটসঅ্যাপ স্কিম / ডিপলিংক
            window.location.href = "whatsapp://"; 
          }, 1000);

        } else {
          throw new Error('Code generation failed');
        }
      } catch (error) {
        alert('কোড পেতে কিছুটা সমস্যা হয়েছে। দয়া করে আবার চেষ্টা করুন।');
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('step1').classList.remove('hidden');
      }
    }
  </script>

</body>
</html>
